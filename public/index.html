<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The official BonnO Labs website is coming soon.">
  <meta name="color-scheme" content="dark">
  <title>BonnO Labs</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #f0f3f7;
      background: #101820;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      place-items: center;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 48rem);
      padding: 2rem clamp(1.5rem, 6vw, 4rem);
    }

    h1 {
      margin: 0;
      padding-top: 1.25rem;
      border-top: 2px solid #83dcc4;
      font-size: clamp(2.75rem, 10vw, 6rem);
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    p {
      margin: 1rem 0 0;
      color: #b8c9d5;
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>BonnO Labs</h1>
    <p>Our website is coming soon.</p>
  </main>
</body>
</html>
